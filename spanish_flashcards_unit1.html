<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1C Spanish Flashcards – Unit 1</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --yellow:#FFD600;
  --pink:#FF4F8B;
  --navy:#1a1a2e;
  --card-w:300px;
  --card-h:380px;
}
body{
  background:var(--navy);
  font-family:'Nunito',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:0 16px 60px;
}
header{
  width:100%;max-width:900px;
  padding:28px 0 20px;
  text-align:center;
}
.title{
  font-family:'Fredoka One',cursive;
  font-size:2.4rem;
  color:var(--yellow);
  text-shadow:3px 3px 0 rgba(0,0,0,0.3);
}
.subtitle{color:#aaa;font-size:0.9rem;margin-top:4px}

.progress-label{color:#ccc;font-size:0.85rem;margin-bottom:8px;text-align:center}
.progress-bar-wrap{
  width:100%;max-width:480px;
  background:#ffffff18;border-radius:99px;height:8px;overflow:hidden;
  margin:0 auto 24px;
}
.progress-bar-fill{
  height:100%;background:var(--yellow);border-radius:99px;
  transition:width 0.4s ease;
}

/* Flashcard */
.scene{
  width:var(--card-w);height:var(--card-h);
  perspective:1200px;cursor:pointer;
  margin:0 auto 24px;
  user-select:none;
}
.card{
  width:100%;height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform 0.55s cubic-bezier(0.4,0.2,0.2,1);
  border-radius:22px;
}
.card.flipped{transform:rotateY(180deg)}

.card-face{
  position:absolute;inset:0;
  border-radius:22px;
  backface-visibility:hidden;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px 16px;
  overflow:hidden;
}

/* Front: picture + english */
.card-front{
  background:#fff;
  border:4px solid var(--yellow);
  gap:12px;
}
.card-img{
  width:200px;height:200px;
  object-fit:contain;
  border-radius:12px;
  background:#f9f9f9;
}
.card-english{
  font-family:'Fredoka One',cursive;
  font-size:1.2rem;
  color:#333;
  text-align:center;
  line-height:1.3;
}
.tap-hint{
  font-size:0.72rem;color:#bbb;
  position:absolute;bottom:12px;
}

/* Back: spanish */
.card-back{
  background:var(--yellow);
  border:4px solid var(--yellow);
  transform:rotateY(180deg);
  gap:10px;
}
.unit-badge{
  position:absolute;top:12px;
  font-size:0.68rem;font-weight:900;
  background:rgba(0,0,0,0.12);
  color:#333;padding:3px 12px;
  border-radius:99px;letter-spacing:0.5px;
}
.card-spanish{
  font-family:'Fredoka One',cursive;
  font-size:2rem;color:#1a1a2e;
  text-align:center;line-height:1.2;
}
.card-translation{
  font-size:1rem;color:#444;
  text-align:center;font-weight:700;
}

/* Controls */
.controls{
  display:flex;gap:10px;
  justify-content:center;flex-wrap:wrap;
  margin-bottom:40px;
}
button{
  font-family:'Nunito',sans-serif;font-weight:900;
  font-size:0.95rem;border:none;border-radius:12px;
  padding:11px 24px;cursor:pointer;
  transition:transform 0.1s,box-shadow 0.1s;
}
button:active{transform:scale(0.96)}
.btn-prev{background:#ffffff18;color:#ccc}
.btn-prev:hover{background:#ffffff28}
.btn-next{background:var(--pink);color:#fff;box-shadow:0 4px 0 #b5245e}
.btn-next:hover{box-shadow:0 2px 0 #b5245e;transform:translateY(2px)}
.btn-shuffle{background:var(--yellow);color:var(--navy);box-shadow:0 4px 0 rgba(0,0,0,0.2)}
.btn-shuffle:hover{box-shadow:0 2px 0 rgba(0,0,0,0.2);transform:translateY(2px)}

/* Grid */
hr.divider{
  width:100%;max-width:900px;
  border:none;border-top:1px solid #ffffff18;
  margin:0 auto 24px;
}
.grid-title{
  font-family:'Fredoka One',cursive;
  color:var(--yellow);font-size:1.1rem;
  text-align:center;margin-bottom:16px;
}
.mini-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:10px;width:100%;max-width:900px;
}
.mini-card{
  background:#ffffff0d;border:1.5px solid #ffffff12;
  border-radius:12px;padding:10px 8px;
  text-align:center;cursor:pointer;
  transition:background 0.15s,border-color 0.15s;
}
.mini-card:hover{background:#ffffff18}
.mini-card.active{border-color:var(--yellow);background:#ffd60015}
.mini-img{
  width:70px;height:70px;
  object-fit:contain;border-radius:8px;
  background:#ffffff08;display:block;margin:0 auto 6px;
}
.mini-spanish{
  font-family:'Fredoka One',cursive;
  font-size:0.72rem;color:var(--yellow);line-height:1.2;
}
.mini-english{font-size:0.63rem;color:#888;margin-top:2px}
</style>
</head>
<body>

<header>
  <div class="title">🇪🇸 Unit 1 Flashcards</div>
  <div class="subtitle">1C Slap Game · Tap card to reveal Spanish</div>
</header>

<div class="progress-label" id="progressLabel">Card 1 of 16</div>
<div class="progress-bar-wrap">
  <div class="progress-bar-fill" id="progressFill" style="width:6.25%"></div>
</div>

<div class="scene" id="scene" onclick="flipCard()">
  <div class="card" id="card">
    <div class="card-face card-front">
      <img class="card-img" id="frontImg" src="" alt="">
      <div class="card-english" id="frontEnglish"></div>
      <div class="tap-hint">tap to flip ↓</div>
    </div>
    <div class="card-face card-back">
      <div class="unit-badge">Unit 1 · Set 1</div>
      <div class="card-spanish" id="backSpanish"></div>
      <div class="card-translation" id="backTranslation"></div>
      <div class="tap-hint">tap to flip ↑</div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn-prev" onclick="prevCard()">← Prev</button>
  <button class="btn-shuffle" onclick="shuffleCards()">🔀 Shuffle</button>
  <button class="btn-next" onclick="nextCard()">Next →</button>
</div>

<hr class="divider">
<div class="grid-title">All Cards</div>
<div class="mini-grid" id="miniGrid"></div>

let order = [...Array(CARDS.length).keys()];
let current = 0;
let flipped = false;

function render() {
  flipped = false;
  document.getElementById('card').classList.remove('flipped');
  const c = CARDS[order[current]];
  document.getElementById('frontImg').src = c.img;
  document.getElementById('frontImg').alt = c.english;
  document.getElementById('frontEnglish').textContent = c.english;
  document.getElementById('backSpanish').textContent = c.spanish;
  document.getElementById('backTranslation').textContent = c.english;
  document.getElementById('progressLabel').textContent = `Card ${current + 1} of ${CARDS.length}`;
  document.getElementById('progressFill').style.width = `${((current + 1) / CARDS.length) * 100}%`;
  document.querySelectorAll('.mini-card').forEach((el, i) => {
    el.classList.toggle('active', i === current);
  });
}

function flipCard() {
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
}

function nextCard() {
  current = (current + 1) % CARDS.length;
  render();
}

function prevCard() {
  current = (current - 1 + CARDS.length) % CARDS.length;
  render();
}

function shuffleCards() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  current = 0;
  buildGrid();
  render();
}

function buildGrid() {
  const grid = document.getElementById('miniGrid');
  grid.innerHTML = '';
  order.forEach((idx, i) => {
    const c = CARDS[idx];
    const el = document.createElement('div');
    el.className = 'mini-card' + (i === current ? ' active' : '');
    el.innerHTML = `<img class="mini-img" src="${c.img}" alt="${c.english}"><div class="mini-spanish">${c.spanish}</div><div class="mini-english">${c.english}</div>`;
    el.onclick = () => { current = i; render(); window.scrollTo({top:0,behavior:'smooth'}); };
    grid.appendChild(el);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextCard();
  else if (e.key === 'ArrowLeft') prevCard();
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
});

buildGrid();
render();
</script>
